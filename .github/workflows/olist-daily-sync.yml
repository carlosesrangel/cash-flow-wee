name: Sincroniza??o Olist Di?ria

on:
  schedule:
    - cron: '17 */4 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: Modo de sincroniza??o
        type: choice
        default: incremental
        options: [incremental, initial]

permissions:
  contents: read
concurrency:
  group: production-financial-writes
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Sincronizar e atualizar dados financeiros
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          OLIST_CLIENT_ID: ${{ secrets.OLIST_CLIENT_ID }}
          OLIST_CLIENT_SECRET: ${{ secrets.OLIST_CLIENT_SECRET }}
          SYNC_MODE: ${{ inputs.mode || 'incremental' }}
        run: npx cross-env NODE_OPTIONS=--conditions=react-server tsx scripts/run-olist-sync.ts --mode "$SYNC_MODE" --skip-derived-refresh
      - name: Atualizar analytics e ledger derivados
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npx cross-env NODE_OPTIONS=--conditions=react-server tsx scripts/run-financial-refresh.ts
      - name: Resultado
        if: always()
        env:
          RESULT: ${{ job.status }}
        run: |
          echo "## olist: $RESULT" >> "$GITHUB_STEP_SUMMARY"
          echo "M?tricas e checkpoint por organiza??o: etapa de sincroniza??o e tabela sync_runs." >> "$GITHUB_STEP_SUMMARY"
          if [ "$RESULT" != "success" ]; then
            echo "::error::Sincroniza??o olist falhou. Consulte os logs e sync_runs."
            exit 1
          fi
