name: Sincronização Olist Diária

on:
  schedule:
    # Executa diariamente às 02:00 AM (UTC) = 23:00 BRT (previous day)
    # Horário escolhido: fora do horário de pico
    - cron: '0 2 * * *'

  workflow_dispatch:
    # Permite disparo manual via GitHub UI
    # Actions → Sincronização Olist Diária → Run workflow
    inputs:
      mode:
        description: 'Modo de sincronização'
        required: false
        default: 'incremental'
        type: choice
        options:
          - incremental
          - initial

jobs:
  sync-olist:
    name: Sincronizar dados Olist
    runs-on: ubuntu-latest
    # Roda como processo Node comum (não function serverless): a sincronização
    # inicial completa (~600+ contas a receber, cada uma com uma chamada de
    # detalhe extra) respeita o rate limit de 25 req/min da Olist e pode levar
    # ~25 minutos — muito além do teto de 300s de uma function da Vercel.
    # Rodar aqui evita esse timeout. Ver scripts/run-olist-sync.ts.
    timeout-minutes: 30

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci

      - name: Sincronizar dados Olist (todas as organizações conectadas)
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          OLIST_CLIENT_ID: ${{ secrets.OLIST_CLIENT_ID }}
          OLIST_CLIENT_SECRET: ${{ secrets.OLIST_CLIENT_SECRET }}
          OLIST_STATE_SECRET: ${{ secrets.OLIST_STATE_SECRET }}
        run: |
          MODE="${{ github.event.inputs.mode }}"
          if [ -z "$MODE" ]; then
            npx cross-env NODE_OPTIONS=--conditions=react-server tsx scripts/run-olist-sync.ts --skip-derived-refresh
          else
            npx cross-env NODE_OPTIONS=--conditions=react-server tsx scripts/run-olist-sync.ts --mode "$MODE" --skip-derived-refresh
          fi

      - name: Verificar status de sync
        if: always()
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          node -e "
          const { createClient } = require('@supabase/supabase-js');

          const supabase = createClient(
            process.env.NEXT_PUBLIC_SUPABASE_URL,
            process.env.SUPABASE_SERVICE_ROLE_KEY
          );

          (async () => {
            const { data, error } = await supabase
              .from('sync_runs')
              .select('org_id, status, started_at, finished_at, error_message')
              .eq('integration', 'olist')
              .gte('started_at', new Date(Date.now() - 2*60*60*1000).toISOString())
              .order('started_at', { ascending: false });

            if (error) {
              console.error('Erro ao buscar status:', error);
              return;
            }

            if (!data || data.length === 0) {
              console.log('ℹ️ Nenhuma sincronização encontrada nas últimas 2 horas');
              return;
            }

            console.log('📊 Status dos últimos syncs:');
            data.forEach(sync => {
              const icon = sync.status === 'success' ? '✅' :
                          sync.status === 'running' ? '⏳' : '❌';
              console.log(\`  \${icon} Org: \${sync.org_id.substring(0,8)}... Status: \${sync.status}\`);
              if (sync.error_message) {
                console.log(\`     Erro: \${sync.error_message}\`);
              }
            });
          })();
          "

      - name: Notificar sucesso (Slack - opcional)
        if: success()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo "ℹ️ Slack webhook não configurado, pulando notificação"
            exit 0
          fi

          curl -X POST "$SLACK_WEBHOOK_URL" \
            -H 'Content-type: application/json' \
            -d '{
              "text": "✅ Sincronização Olist concluída com sucesso",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*✅ Sincronização Olist Diária*\n*Status:* Concluído com sucesso\n*Horário:* '"$(date '+%d/%m/%Y %H:%M:%S')"' (BRT)"
                  }
                }
              ]
            }'

      - name: Coletar detalhes de erro
        if: failure()
        id: error-details
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          node -e "
          const { createClient } = require('@supabase/supabase-js');
          const supabase = createClient(
            process.env.NEXT_PUBLIC_SUPABASE_URL,
            process.env.SUPABASE_SERVICE_ROLE_KEY
          );

          (async () => {
            const { data: failures } = await supabase
              .from('sync_runs')
              .select('org_id, error_message, started_at')
              .eq('integration', 'olist')
              .eq('status', 'failed')
              .gte('started_at', new Date(Date.now() - 60*60*1000).toISOString())
              .order('started_at', { ascending: false });

            const summary = failures && failures.length > 0
              ? failures.map(f => \`• \${f.org_id.substring(0,8)}...: \${f.error_message || 'Erro desconhecido'}\`).join('\\n')
              : 'Sem detalhes de erro registrados';

            console.log('ERROR_DETAILS<<EOF');
            console.log(summary);
            console.log('EOF');
          })();
          " >> $GITHUB_OUTPUT

      - name: Notificar falha (Slack - opcional)
        if: failure()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo "ℹ️ Slack webhook não configurado"
            exit 0
          fi

          ERROR_DETAILS="${{ steps.error-details.outputs.ERROR_DETAILS }}"

          curl -X POST "$SLACK_WEBHOOK_URL" \
            -H 'Content-type: application/json' \
            -d '{
              "text": "❌ Sincronização Olist falhou",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*❌ Sincronização Olist Diária Falhou*\n*Horário:* '"$(date '+%d/%m/%Y %H:%M:%S')"' (BRT)\n*Detalhes:*\n'"$ERROR_DETAILS"'\n\n<https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}|Ver logs completos> | <https://cash-flow-wee.vercel.app/sincronizacoes|Dashboard>"
                  }
                }
              ]
            }'

  # Job adicional: Notificar se nenhuma sincronização rodou (health check)
  health-check:
    name: Verificar saúde de sincronizações
    runs-on: ubuntu-latest
    needs: sync-olist
    if: always()  # Roda mesmo que sync-olist falhe

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci

      - name: Verificar últimos syncs
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          node -e "
          const { createClient } = require('@supabase/supabase-js');

          const supabase = createClient(
            process.env.NEXT_PUBLIC_SUPABASE_URL,
            process.env.SUPABASE_SERVICE_ROLE_KEY
          );

          (async () => {
            const { data: successes } = await supabase
              .from('sync_runs')
              .select('id')
              .eq('integration', 'olist')
              .eq('status', 'success')
              .gte('started_at', new Date(Date.now() - 2*60*60*1000).toISOString());

            const { data: failures } = await supabase
              .from('sync_runs')
              .select('id')
              .eq('integration', 'olist')
              .eq('status', 'failed')
              .gte('started_at', new Date(Date.now() - 2*60*60*1000).toISOString());

            const successCount = (successes || []).length;
            const failureCount = (failures || []).length;

            console.log(\`📊 Sincronizações nas últimas 2 horas:\`);
            console.log(\`   ✅ Sucesso: \${successCount}\`);
            console.log(\`   ❌ Falhas: \${failureCount}\`);

            if (successCount === 0 && failureCount === 0) {
              console.log(\`⚠️  Nenhuma sincronização rodou (pode indicar problema)\`);
            }
          })();
          "
