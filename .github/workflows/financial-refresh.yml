name: Atualização Financeira Derivada

on:
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: production-financial-writes
  cancel-in-progress: false

jobs:
  refresh:
    name: Analytics → Ledger
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout código
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Instalar dependências
        run: npm ci
      - name: Atualizar analytics e ledger
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npx cross-env NODE_OPTIONS=--conditions=react-server tsx scripts/run-financial-refresh.ts
